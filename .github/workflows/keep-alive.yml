name: Keep Render Awake

# Pings the Render free-tier service so it doesn't spin down after inactivity.
on:
  schedule:
    # Every 14 minutes (Render free instances sleep after ~15 min idle).
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          curl --silent --show-error --fail --location \
            --max-time 30 \
            https://YOUR-APP-NAME.onrender.com
