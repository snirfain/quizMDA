name: Deploy quizMDA

# Runs automatically on every push to the main branch.
on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server & DAG engine unit tests
        run: node --test workflows/rollingCaseEngine.test.mjs

      # Render auto-deploys on push to main; this hook is an optional explicit
      # trigger. Guarded so a missing/empty secret never fails the pipeline.
      - name: Trigger Render deploy
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping (Render auto-deploys on push)."
          fi
